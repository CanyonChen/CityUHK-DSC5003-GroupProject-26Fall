# Include inside nginx's http context. Replace domains, TLS certificates and document roots.
map $http_upgrade $events_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    server_name tickets.example.org;
    ssl_certificate /etc/ssl/events/fullchain.pem;
    ssl_certificate_key /etc/ssl/events/privkey.pem;
    root /srv/events/web-user/dist;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $events_connection_upgrade;
        proxy_read_timeout 75s;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl;
    server_name admin.example.org;
    ssl_certificate /etc/ssl/events/fullchain.pem;
    ssl_certificate_key /etc/ssl/events/privkey.pem;
    root /srv/events/web-admin/dist;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $events_connection_upgrade;
        proxy_read_timeout 75s;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
