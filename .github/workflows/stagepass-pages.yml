name: Publish StagePass to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '5003_StagePass/pages/**'
      - '5003_StagePass/web-user/public/media/*.svg'
      - '.github/workflows/stagepass-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stagepass-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Assemble the public site
        run: |
          mkdir -p _site/media
          cp -R 5003_StagePass/pages/. _site/
          cp 5003_StagePass/web-user/public/media/*.svg _site/media/
          test -s _site/index.html
          test -s _site/data/snapshot.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v5
