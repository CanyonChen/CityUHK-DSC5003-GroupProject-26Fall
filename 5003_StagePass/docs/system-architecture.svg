<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">StagePass system architecture</title>
  <desc id="desc">Two browser clients, one shared Node.js Express API, a MySQL or MariaDB database, a test payment adapter, background jobs, and a WebSocket invalidation channel.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fc; }
      .panel { fill: #ffffff; stroke: #c9d5e6; stroke-width: 2; }
      .client { fill: #eaf3ff; stroke: #3b82f6; stroke-width: 2.5; }
      .api { fill: #ecfdf5; stroke: #10b981; stroke-width: 2.5; }
      .service { fill: #ffffff; stroke: #34d399; stroke-width: 2; }
      .db { fill: #eef2ff; stroke: #4f46e5; stroke-width: 3; }
      .pay { fill: #fff7ed; stroke: #f97316; stroke-width: 2.5; }
      .job { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2.5; }
      .title { fill: #0f172a; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; font-size: 42px; font-weight: 700; }
      .subtitle { fill: #475569; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; font-size: 19px; }
      .label { fill: #0f172a; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .small { fill: #334155; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; }
      .tiny { fill: #475569; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; font-size: 15px; }
      .mono { fill: #1e293b; font-family: "Cascadia Mono", "Consolas", monospace; font-size: 17px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrowhead); }
      .arrow-strong { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#arrowhead-teal); }
      .arrow-ws { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrowhead-purple); }
      .arrow-label { fill: #475569; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; font-size: 15px; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <rect class="panel" x="36" y="30" width="1528" height="840" rx="22" filter="url(#shadow)"/>

  <text class="title" x="76" y="86">StagePass · System Architecture</text>
  <text class="subtitle" x="78" y="118">Two browser clients · one shared API · one relational database</text>

  <rect class="client" x="90" y="150" width="300" height="110" rx="16" filter="url(#shadow)"/>
  <text class="label" x="240" y="188" text-anchor="middle">User web</text>
  <text class="small" x="240" y="218" text-anchor="middle">Vue 3 + Vite</text>
  <text class="mono" x="240" y="244" text-anchor="middle">:8080</text>

  <rect class="client" x="440" y="150" width="300" height="110" rx="16" filter="url(#shadow)"/>
  <text class="label" x="590" y="188" text-anchor="middle">Admin web</text>
  <text class="small" x="590" y="218" text-anchor="middle">Vue 3 + Vite</text>
  <text class="mono" x="590" y="244" text-anchor="middle">:8081</text>

  <rect class="api" x="90" y="320" width="930" height="300" rx="18" filter="url(#shadow)"/>
  <text class="label" x="118" y="356">Node.js / Express API · :3000</text>
  <text class="tiny" x="118" y="380">Shared domain layer · server-side authorization · short transactions</text>

  <rect class="service" x="120" y="400" width="260" height="120" rx="12"/>
  <text class="small" x="250" y="435" text-anchor="middle">REST routes</text>
  <text class="tiny" x="250" y="462" text-anchor="middle">auth · catalog · orders</text>
  <text class="tiny" x="250" y="484" text-anchor="middle">payments · tickets · admin</text>

  <rect class="service" x="420" y="400" width="290" height="120" rx="12"/>
  <text class="small" x="565" y="435" text-anchor="middle">Domain services</text>
  <text class="tiny" x="565" y="462" text-anchor="middle">validation · transactions</text>
  <text class="tiny" x="565" y="484" text-anchor="middle">idempotency · state rules</text>

  <rect class="service" x="750" y="400" width="230" height="120" rx="12"/>
  <text class="small" x="865" y="435" text-anchor="middle">WebSocket</text>
  <text class="tiny" x="865" y="462" text-anchor="middle">/ws · scoped</text>
  <text class="tiny" x="865" y="484" text-anchor="middle">invalidation signal</text>

  <rect class="pay" x="1090" y="330" width="390" height="120" rx="16" filter="url(#shadow)"/>
  <text class="label" x="1285" y="368" text-anchor="middle">Test payment adapter</text>
  <text class="small" x="1285" y="398" text-anchor="middle">simulated success / failure / replay</text>
  <text class="tiny" x="1285" y="424" text-anchor="middle">no real gateway · no real charge</text>

  <rect class="job" x="1090" y="480" width="390" height="120" rx="16" filter="url(#shadow)"/>
  <text class="label" x="1285" y="518" text-anchor="middle">Expiry / reconciliation</text>
  <text class="small" x="1285" y="548" text-anchor="middle">background jobs</text>
  <text class="tiny" x="1285" y="574" text-anchor="middle">release seats · recheck pending payments</text>

  <rect class="db" x="300" y="700" width="510" height="120" rx="18" filter="url(#shadow)"/>
  <text class="label" x="555" y="740" text-anchor="middle">MySQL 8 / MariaDB 10.4</text>
  <text class="small" x="555" y="772" text-anchor="middle">InnoDB · 17 tables · constraints · indexes</text>
  <text class="tiny" x="555" y="798" text-anchor="middle">seat inventory · orders · payments · tickets · refunds · audit</text>

  <path class="arrow" d="M 240 260 C 240 310, 245 350, 250 400"/>
  <path class="arrow" d="M 590 260 C 520 300, 390 330, 330 400"/>
  <text class="arrow-label" x="300" y="310">HTTP(S) JSON + JWT</text>

  <path class="arrow-strong" d="M 380 460 L 420 460"/>

  <path class="arrow-strong" d="M 565 520 L 565 700"/>
  <text class="arrow-label" x="590" y="625">mysql2 pool · short transactions</text>

  <path class="arrow" d="M 565 520 L 565 660 L 1010 660 L 1010 390 L 1090 390"/>
  <text class="arrow-label" x="850" y="340">payment API</text>

  <path class="arrow" d="M 600 520 L 600 680 L 1050 680 L 1050 540 L 1090 540"/>
  <text class="arrow-label" x="850" y="612">schedule / scan</text>

  <path class="arrow-ws" d="M 710 420 L 750 420"/>
  <text class="arrow-label" x="690" y="390">publish change</text>

  <path class="arrow-ws" d="M 865 400 C 865 300, 700 270, 590 260"/>
  <path class="arrow-ws" d="M 865 400 C 865 310, 520 285, 380 260"/>
  <text class="arrow-label" x="930" y="300">invalidation signal → REST refetch</text>

  <text class="tiny" x="90" y="842">Browsers never connect directly to the database. All business rules, permissions and state transitions run in the API and database transactions.</text>
</svg>
